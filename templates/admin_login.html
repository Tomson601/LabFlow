<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>LabFlow Admin - Logowanie</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
    <div class="login-container">
        <h2>LabFlow Admin</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Nazwa użytkownika" required autofocus>
            <input type="password" name="password" placeholder="Hasło" required>
            <button type="submit">Zaloguj się jako admin</button>
        </form>
        <div class="footer">&copy; JD Solutions 2026 LabFlow</div>
    </div>
</body>
</html>
