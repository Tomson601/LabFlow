<div id="rezerwacje-content" class="tab-content">
    <h2>Lista rezerwacji</h2>
    <button id="dodaj-rezerwacje-btn" class="labflow-btn labflow-btn-primary" onclick="document.getElementById('formularz-rezerwacji').style.display='block'">Dodaj rezerwację</button>
    <div id="formularz-rezerwacji" style="display:none;">
        <form id="rezerwacja-form">
            <label for="laboratorium">Laboratorium:</label>
            <select id="laboratorium" name="laboratorium" required></select>
            <label for="sprzet">Sprzęt:</label>
            <select id="sprzet" name="sprzet" required></select>
            <label for="data_rozpoczecia">Data rozpoczęcia:</label>
            <input type="datetime-local" id="data_rozpoczecia" name="data_rozpoczecia" required>
            <label for="data_zakonczenia">Data zakończenia:</label>
            <input type="datetime-local" id="data_zakonczenia" name="data_zakonczenia" required>
            <div id="dostepnosc-sprzetu" class="availability-panel"></div>
            <button type="submit" class="labflow-btn labflow-btn-primary">Zarezerwuj</button>
            <button type="button" class="labflow-btn labflow-btn-secondary" onclick="document.getElementById('formularz-rezerwacji').style.display='none'">Anuluj</button>
        </form>
    </div>
    <div id="filtry-rezerwacji" class="labflow-filter-bar">
        <div>
            <label for="filtr-rezerwacje-status">Status</label>
            <select id="filtr-rezerwacje-status">
                <option value="">Wszystkie</option>
                <option value="oczekujaca">oczekująca</option>
                <option value="aktywna">aktywna</option>
                <option value="zakonczona">zakończona</option>
            </select>
        </div>
        {% if user and user.rola == 'admin' %}
        <div>
            <label for="filtr-rezerwacje-uzytkownik">Użytkownik</label>
            <input type="text" id="filtr-rezerwacje-uzytkownik" placeholder="Imię, nazwisko lub email">
        </div>
        {% endif %}
    </div>
    <div id="lista-rezerwacji"></div>
</div>


<div id="modal-overlay"></div>


<div id="rezerwacja-modal" class="labflow-modal">
    <div class="labflow-modal-content">
        <div class="labflow-modal-header">
            <h3>Edytuj rezerwację</h3>
            <button type="button" class="labflow-modal-close" onclick="zamknijModalRezerwacji()">&times;</button>
        </div>
        <form id="rezerwacja-edit-form">
            <input type="hidden" id="edit-rezerwacja-id">
            <label for="edit-sprzet">Sprzęt</label>
            <select id="edit-sprzet" name="sprzet" required></select>
            <label for="edit-data-rozpoczecia">Data rozpoczęcia</label>
            <input type="datetime-local" id="edit-data-rozpoczecia" name="data_rozpoczecia" required>
            <label for="edit-data-zakonczenia">Data zakończenia</label>
            <input type="datetime-local" id="edit-data-zakonczenia" name="data_zakonczenia" required>
            <div id="edit-dostepnosc-sprzetu" class="availability-panel"></div>
            <div class="labflow-modal-actions">
                <button type="submit" class="labflow-btn labflow-btn-primary">Zapisz zmiany</button>
                <button type="button" class="labflow-btn labflow-btn-danger" onclick="anulujRezerwacjeZModyla()">Anuluj rezerwację</button>
                
            </div>
        </form>
    </div>
</div>

<link rel="stylesheet" href="/static/css/panel_rezerwacje.css">
<script src="/static/js/utils.js"></script>
<script>
window.currentUserRole = "{{ user.rola|default:'' }}";
</script>
<script src="/static/js/panel_rezerwacje.js"></script>
