<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>LabFlow - Logowanie</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>LabFlow</h2>
        {% if form.errors %}
            <div class="error">Nieprawidłowy email lub hasło.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Email" required autofocus>
            <input type="password" name="password" placeholder="Hasło" required>
            <button type="submit">Zaloguj się</button>
        </form>
        <div class="register-link">
            <a href="/register/" class="register-button">Zarejestruj się</a>
        </div>
        <div class="register-link" style="margin-top: 8px;">
            <a href="/admin-login/" class="register-button" style="background: #333;">Panel administratora</a>
        </div>
        <div class="footer">&copy; JD Solutions 2026 LabFlow</div>
    </div>
</body>
</html>
