<div id="laboratoria-content" class="tab-content">
    <h2>Laboratoria</h2>
    {% if user %}
    {% if user.rola == 'admin' or user.rola == 'pracownik' %}
    <button id="dodaj-laboratorium-btn"
        onclick="document.getElementById('formularz-laboratorium').style.display='block'">Dodaj laboratorium</button>
    <div id="formularz-laboratorium" style="display:none;">
        <form id="laboratorium-form">
            <label for="nazwa-lab">Nazwa:</label>
            <input type="text" id="nazwa-lab" name="nazwa" required>
            <label for="lokalizacja-lab">Lokalizacja:</label>
            <input type="text" id="lokalizacja-lab" name="lokalizacja" required>
            <label for="opis-lab">Opis:</label>
            <input type="text" id="opis-lab" name="opis">
            <button type="submit" class="labflow-btn labflow-btn-primary">Dodaj</button>
            <button type="button" class="labflow-btn labflow-btn-secondary"
                onclick="document.getElementById('formularz-laboratorium').style.display='none'">Anuluj</button>
        </form>
    </div>
    {% endif %}
    {% endif %}
    <div id="filtry-laboratoria" class="labflow-filter-bar">
        <div>
            <label for="filtr-lab-nazwa">Nazwa</label>
            <input type="text" id="filtr-lab-nazwa" placeholder="Filtruj po nazwie">
        </div>
        <div>
            <label for="filtr-lab-lokalizacja">Lokalizacja</label>
            <input type="text" id="filtr-lab-lokalizacja" placeholder="Filtruj po lokalizacji">
        </div>
        <div>
            <label for="filtr-lab-opis">Opis</label>
            <input type="text" id="filtr-lab-opis" placeholder="Filtruj po opisie">
        </div>
    </div>
    <div id="lista-laboratoriow"></div>

    <div id="laboratorium-modal" class="labflow-modal">
        <div class="labflow-modal-content">
            <div class="labflow-modal-header">
                <h3>Edytuj laboratorium</h3>
                <button type="button" class="labflow-modal-close" onclick="zamknijModalLaboratorium()">&times;</button>
            </div>
            <form id="laboratorium-edit-form">
                <input type="hidden" id="edit-lab-id">
                <label for="edit-lab-nazwa">Nazwa</label>
                <input type="text" id="edit-lab-nazwa" required>
                <label for="edit-lab-lokalizacja">Lokalizacja</label>
                <input type="text" id="edit-lab-lokalizacja" required>
                <label for="edit-lab-opis">Opis</label>
                <input type="text" id="edit-lab-opis">
                <div class="labflow-modal-actions">
                    <button type="submit" class="labflow-btn labflow-btn-primary">Zapisz zmiany</button>
                    <button type="button" id="usun-lab-modal-btn" class="labflow-btn labflow-btn-danger" onclick="usunLaboratoriumZModala()">Usuń laboratorium</button>
                </div>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/static/css/panel_laboratoria.css">
<script src="/static/js/utils.js"></script>
<script src="/static/js/panel_laboratoria.js"></script>
<script>
    window.currentUserRole = "{{ user.rola|default:'' }}";
</script>
