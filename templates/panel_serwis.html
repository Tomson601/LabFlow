<div id="serwis-content" class="tab-content">
    <h2>Serwis</h2>
    <button id="dodaj-serwis-btn" onclick="document.getElementById('formularz-serwis').style.display='block'">Dodaj zgłoszenie serwisowe</button>
    <div id="formularz-serwis" style="display:none;">
        <form id="serwis-form">
            <label for="sprzet-serwis">Sprzęt:</label>
            <select id="sprzet-serwis" name="sprzet" required></select>
            <label for="data-zgloszenia">Data zgłoszenia:</label>
            <input type="datetime-local" id="data-zgloszenia" name="data_zgloszenia" required>
            <label for="opis-serwis">Opis:</label>
            <input type="text" id="opis-serwis" name="opis" required>
            <label for="status-serwis">Status:</label>
            <select id="status-serwis" name="status" required>
                <option value="nowe">nowe</option>
                <option value="w trakcie">w trakcie</option>
                <option value="zakończone">zakończone</option>
            </select>
            <button type="submit">Dodaj</button>
            <button type="button" onclick="document.getElementById('formularz-serwis').style.display='none'">Anuluj</button>
        </form>
    </div>
    <div id="lista-serwis"></div>
</div>

<link rel="stylesheet" href="/static/css/panel_serwis.css">
<script src="/static/js/utils.js"></script>
<script src="/static/js/panel_serwis.js"></script>
